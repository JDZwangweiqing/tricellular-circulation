    const drawHead=(x,y,ux,uy,sz)=>{
      g.beginPath();
      g.moveTo(x+ux*sz,y+uy*sz);
      g.lineTo(x-uy*sz*0.55-ux*sz*0.45,y+ux*sz*0.55-uy*sz*0.45);
      g.lineTo(x+uy*sz*0.55-ux*sz*0.45,y-ux*sz*0.55-uy*sz*0.45);
      g.closePath();g.fill();
    };
    g.lineCap='round';g.lineJoin='round';g.lineWidth=1.8;
    g.strokeStyle=ARW_COL;g.fillStyle=ARW_COL;
    /* 规则网格逐点布箭（无链式占用，覆盖无空洞；GS=网格间距，抽稀调 GS）：
       每格一枚箭头：先沿风场密采样积分出弯曲路径，再把中间点向弦线收拢（垂距限幅=弦长×0.16）
       并做 3 遍窗口平滑 → 无抖动无生硬转折的平缓弧线；
       与邻近已绘箭头相交或距离过近（<MIND，防平行叠压）时按 65%/40% 逐级缩短重试，仍不行则跳过 */
    const GS=4.5,STEPS=8,STP=0.5;   /* 箭头沿流向约 4°≈23px ≈ 网格间距 25.6px：同排箭头首尾相接不叠压 */
    const CS=160;                                    /* 相交检测空间哈希格边长(px) */
    const MIND=2.2;                                  /* 最小间距(px)：小于此视为与已绘箭头重叠 */
    const occ=new Map();                             /* key "gx,gy" -> [箭头折线,...] */
    const segCross=(a,b,c,d)=>{
      const d1=(d[0]-c[0])*(a[1]-c[1])-(d[1]-c[1])*(a[0]-c[0]);
      const d2=(d[0]-c[0])*(b[1]-c[1])-(d[1]-c[1])*(b[0]-c[0]);
      const d3=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
      const d4=(b[0]-a[0])*(d[1]-a[1])-(b[1]-a[1])*(d[0]-a[0]);
      return d1*d2<0&&d3*d4<0;
    };
    const polyCross=(P,Q)=>{
      for(let i=0;i<P.length-1;i++)for(let j=0;j<Q.length-1;j++){
        if(Math.max(P[i][0],P[i+1][0])<Math.min(Q[j][0],Q[j+1][0])||
           Math.min(P[i][0],P[i+1][0])>Math.max(Q[j][0],Q[j+1][0])||
           Math.max(P[i][1],P[i+1][1])<Math.min(Q[j][1],Q[j+1][1])||
           Math.min(P[i][1],P[i+1][1])>Math.max(Q[j][1],Q[j+1][1]))continue;
        if(segCross(P[i],P[i+1],Q[j],Q[j+1]))return true;
      }
      return false;
    };
    const ptSeg=(p,a,b)=>{   /* 点到线段距离 */
      const abx=b[0]-a[0],aby=b[1]-a[1],L2=abx*abx+aby*aby||1e-12;
      const t=Math.max(0,Math.min(1,((p[0]-a[0])*abx+(p[1]-a[1])*aby)/L2));
      return Math.hypot(p[0]-a[0]-t*abx,p[1]-a[1]-t*aby);
    };
    const segDist=(a,b,c,d)=>Math.min(ptSeg(a,c,d),ptSeg(b,c,d),ptSeg(c,a,b),ptSeg(d,a,b));
    const polyDist=(P,Q)=>{  /* 两折线最小距离（带 MIND 早退框） */
      let m=1e9;
      for(let i=0;i<P.length-1;i++)for(let j=0;j<Q.length-1;j++){
        if(Math.max(P[i][0],P[i+1][0])<Math.min(Q[j][0],Q[j+1][0])-MIND||
           Math.min(P[i][0],P[i+1][0])>Math.max(Q[j][0],Q[j+1][0])+MIND||
           Math.max(P[i][1],P[i+1][1])<Math.min(Q[j][1],Q[j+1][1])-MIND||
           Math.min(P[i][1],P[i+1][1])>Math.max(Q[j][1],Q[j+1][1])+MIND)continue;
        const d=segDist(P[i],P[i+1],Q[j],Q[j+1]);
        if(d<m)m=d;
      }
      return m;
    };
    for(let la=88;la>=-88;la-=GS){
      const cl=Math.max(0.22,Math.cos(la*Math.PI/180));
      const lonStep=GS/cl;
      for(let lo=-180+((Math.round(la/GS)%2)*lonStep*0.5);lo<180;lo+=lonStep){   /* 奇偶行交错 */
        const pts=[[lo,la]];
        let x=lo,y=la;
        for(let s2=0;s2<STEPS;s2++){
          const dr=windAt(y,x);
          x+=dr[0]*STP/Math.max(0.35,Math.cos(y*Math.PI/180));
          y+=dr[1]*STP;
          if(y>88||y<-88)break;
          pts.push([x,y]);
        }
        if(pts.length<4)continue;
        const raw=pts.map(q=>[(q[0]+180)/360*W,(90-q[1])/180*H]);
        const A0=raw[0],B0=raw[raw.length-1];
        if(Math.abs(B0[0]-A0[0])>W/2)continue;   /* 跨 180° 接缝的箭头跳过 */
        /* 弧度限幅：中间点向弦线投影，垂距超过弦长 16% 的部分截断；随后 3 遍窗口平滑去除折角 */
        const ABx=B0[0]-A0[0],ABy=B0[1]-A0[1],AL2=ABx*ABx+ABy*ABy||1;
        const MAXOFF=0.16*Math.sqrt(AL2);
        let P=raw.map((p,i)=>{
          if(i===0||i===raw.length-1)return p;
          const t=((p[0]-A0[0])*ABx+(p[1]-A0[1])*ABy)/AL2;
          const qx=A0[0]+t*ABx,qy=A0[1]+t*ABy;
          let dx=p[0]-qx,dy=p[1]-qy;const dl=Math.hypot(dx,dy);
          if(dl>MAXOFF){dx*=MAXOFF/dl;dy*=MAXOFF/dl;}
          return [qx+dx,qy+dy];
        });
        for(let pass=0;pass<3;pass++){
          const src=P.slice();
          for(let i=1;i<P.length-1;i++){
            P[i]=[(src[i-1][0]+2*src[i][0]+src[i+1][0])/4,(src[i-1][1]+2*src[i][1]+src[i+1][1])/4];
          }
        }
        /* 不相交检测：空间哈希取邻近箭头，相交则缩短重试 */
        let px=null;
        for(const frac of [1,0.65,0.4]){
          const cand=frac===1?P:P.slice(0,Math.max(3,Math.round(P.length*frac)));
          if(cand.length<3)break;
          let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
          for(const q of cand){if(q[0]<minx)minx=q[0];if(q[0]>maxx)maxx=q[0];if(q[1]<miny)miny=q[1];if(q[1]>maxy)maxy=q[1];}
          const keys=[];
          for(let gx=Math.floor(minx/CS);gx<=Math.floor(maxx/CS);gx++)
            for(let gy=Math.floor(miny/CS);gy<=Math.floor(maxy/CS);gy++)keys.push(gx+','+gy);
          let hit=false;
          for(const k of keys){
            const arr=occ.get(k);if(!arr)continue;
            for(const Q of arr)if(polyCross(cand,Q)||polyDist(cand,Q)<MIND){hit=true;break;}
            if(hit)break;
          }
          if(!hit){
            for(const k of keys){if(!occ.has(k))occ.set(k,[]);occ.get(k).push(cand);}
            px=cand;break;
          }
        }
        if(!px)continue;
        /* 中点二次贝塞尔平滑为弧线 */
        g.beginPath();g.moveTo(px[0][0],px[0][1]);
        for(let i=1;i<px.length-1;i++){
          g.quadraticCurveTo(px[i][0],px[i][1],(px[i][0]+px[i+1][0])/2,(px[i][1]+px[i+1][1])/2);
        }
        g.lineTo(px[px.length-1][0],px[px.length-1][1]);
        g.stroke();
        const e=px[px.length-1],e2=px[px.length-2];
        const dx=e[0]-e2[0],dy=e[1]-e2[1],dl=Math.hypot(dx,dy)||1;
        drawHead(e[0],e[1],dx/dl,dy/dl,5.6);
      }
    }
    /* 平面图用不透明版本（球面图层带半透明 alpha，平面图直接铺黑底会发暗） */
    const c2=document.createElement('canvas');c2.width=2048;c2.height=1024;
    const g2=c2.getContext('2d');g2.drawImage(c,0,0);
    const id2=g2.getImageData(0,0,2048,1024);
    for(let i=3;i<id2.data.length;i+=4)id2.data[i]=255;
    g2.putImageData(id2,0,0);
    SLP_PLAN[(m===0)?0:6]=c2;   /* 键与 SLP_CVS 一致：0=1月 6=7月 */
    return c;
  };
  SLP_CVS[0]=mk(0);SLP_CVS[6]=mk(1);   /* 键=月份下标(0=1月,6=7月)，CENTERS 下标 0/1 */
})();

let progE,progT,progA,earthVBOs,atmoVBOs,texLoc,uniE={},uniT={},uniA={};
let slpTexs=null,slpOn=false;   /* 海平面气压图层纹理 / 显示开关（真实大气运动图复选框） */
let landOn=false,planOn=false;  /* 单圈页海陆分布开关（默认纯蓝球）；真实大气页平面世界图开关 */
let showJet=false;              /* 高空急流开关（三圈环流模式图复选框控制；默认不显示） */
let circOn=true;                /* 三圈环流开关（模式图复选框；取消则隐藏球外围大气层与三圈环流箭头） */
function init(){
  progE=mkProg(VS_EARTH,FS_EARTH);
  progT=mkProg(VS_TUBE,FS_TUBE);
  progA=mkProg(VS_ATMO,FS_ATMO);
  const sp=buildSphere(48,96);
  earthVBOs={
    p:mkBuf(gl.ARRAY_BUFFER,new Float32Array(sp.pos)),
    uv:mkBuf(gl.ARRAY_BUFFER,new Float32Array(sp.uv)),
    i:mkBuf(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(sp.idx)),
    n:sp.idx.length
  };
  atmoVBOs={
    p:mkBuf(gl.ARRAY_BUFFER,new Float32Array(sp.pos)),
    i:mkBuf(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(sp.idx)),
    n:sp.idx.length
  };
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([20,60,120,255]));
  const img=new Image();
  img.onload=()=>{
    /* POT 规范化：WebGL1 下 WRAP_S=REPEAT 且纹理非 2 的幂时，部分 GPU/浏览器会判定纹理不完整，
       地球贴图会整片变黑。这里统一重绘到 2 次幂画布后再上传，确保贴图在任何设备都正常显示 */
    let src=img;
    const pot=v=>{let p=1;while(p<v)p*=2;return p;};
    const pw=pot(img.width),ph=pot(img.height);
    if(pw!==img.width||ph!==img.height){
      const c=document.createElement('canvas');c.width=pw;c.height=ph;
      const g=c.getContext('2d');g.imageSmoothingQuality='high';
      g.drawImage(img,0,0,pw,ph);src=c;
    }
    gl.bindTexture(gl.TEXTURE_2D,tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,src);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    bakeLandMask(img);buildDense();
  };
  img.src=TEX_SRC;
  /* 海平面气压分布图层纹理（1月/7月两张，等距圆柱投影 canvas → 纹理单元1） */
  slpTexs={};
  for(const m of [0,6]){
    const tx=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,tx);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,SLP_CVS[m]);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    slpTexs[m]=tx;
  }
  rebuildSeasonGeom();
  for(const n of ['uMVP','uM','uCam','uTex','uSlp','uSlpK','uSea','uHeatK'])uniE[n]=gl.getUniformLocation(progE,n);
  for(const n of ['uMVP','uM','uVP','uCam','uA','uPet','uPetCol','uPetA','uFrK','uGrid','uTint','uTintK','uVcRim'])uniT[n]=gl.getUniformLocation(progT,n);
  for(const n of ['uM','uVP','uCam','uA'])uniA[n]=gl.getUniformLocation(progA,n);
  uniE.aP=gl.getAttribLocation(progE,'aP');uniE.aUV=gl.getAttribLocation(progE,'aUV');
  uniT.aP=gl.getAttribLocation(progT,'aP');uniT.aN=gl.getAttribLocation(progT,'aN');uniT.aC=gl.getAttribLocation(progT,'aC');
  uniA.aP=gl.getAttribLocation(progA,'aP');
}

function render(t){
  /* 真实大气运动图·平面图模式：隐藏立体地球，仅绘制平面世界图（气压设色+风向箭头+气压中心标注） */
  if(mode===1&&planOn){
    gl.viewport(0,0,cv.width,cv.height);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    drawPlanar();
    return;
  }
  const ph=((t%LOOP)+LOOP)%LOOP,sA=shellAlpha(ph);
  const eye=camPos();
  const asp=W/H;
  const P=mPersp(20*D2R,asp,0.1,50);
  const V=mLookAt(eye,[0,0,0],[0,1,0]);
  const VP=mMul(P,V);
  const M=modelMat();
  const MVP=mMul(VP,M);
  /* 壳体系（帆板/回路/气压带）：固定于相机——地球在其下自转（参考片实测）；
     相机拖拽时反向补偿，使剖切楔始终朝向观察者 */
  const MS=mMul(mRotY(-cam.theta),mRotZ(-cam.phi*0.35));
  const MSShell=MS;

  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.disable(gl.CULL_FACE);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);

  /* 地球 */
  gl.useProgram(progE);
  gl.uniformMatrix4fv(uniE.uMVP,false,MVP);
  gl.uniformMatrix4fv(uniE.uM,false,M);
  gl.uniform3f(uniE.uCam,eye[0],eye[1],eye[2]);
  gl.uniform1i(uniE.uTex,0);
  /* 海平面气压分布图层（纹理单元1；仅真实大气运动图+勾选+1月/7月时显示） */
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D,slpTexs[(curMon===6)?6:0]);
  gl.uniform1i(uniE.uSlp,1);
  gl.uniform1f(uniE.uSlpK,(mode===1&&slpOn)?1:0);
  /* 单圈环流页：海陆分布开关（默认纯蓝球）+ 冷热示意条带（赤道受热/两极受冷） */
  gl.uniform1f(uniE.uSea,(mode===2&&!landOn)?1:0);
  gl.uniform1f(uniE.uHeatK,mode===2?1:0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindBuffer(gl.ARRAY_BUFFER,earthVBOs.p);
  gl.enableVertexAttribArray(uniE.aP);gl.vertexAttribPointer(uniE.aP,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,earthVBOs.uv);
  gl.enableVertexAttribArray(uniE.aUV);gl.vertexAttribPointer(uniE.aUV,2,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,earthVBOs.i);
  gl.drawElements(gl.TRIANGLES,earthVBOs.n,gl.UNSIGNED_SHORT,0);

  /* 大气薄雾（半透明蓝罩，覆盖剖切露出的地球正面）；模式图页取消「三圈环流」时一并隐藏 */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.depthMask(false);
  gl.useProgram(progA);
  gl.uniformMatrix4fv(uniA.uM,false,MSShell);
  gl.uniformMatrix4fv(uniA.uVP,false,VP);
  gl.uniform3f(uniA.uCam,eye[0],eye[1],eye[2]);
  gl.uniform1f(uniA.uA,(mode===0&&!circOn)?0:0.42);   /* 取消三圈环流：大气层透明度→0（不画） */
  gl.bindBuffer(gl.ARRAY_BUFFER,atmoVBOs.p);
  gl.enableVertexAttribArray(uniA.aP);gl.vertexAttribPointer(uniA.aP,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,atmoVBOs.i);
  if(!(mode===0&&!circOn))gl.drawElements(gl.TRIANGLES,atmoVBOs.n,gl.UNSIGNED_SHORT,0);

  /* 壳体：帆板（按深度远→近排序）→ 回路管 → 橙色气压带 */
  gl.useProgram(progT);
  gl.uniformMatrix4fv(uniT.uM,false,MSShell);
  gl.uniformMatrix4fv(uniT.uVP,false,VP);
  gl.uniformMatrix4fv(uniT.uMVP,false,mMul(VP,MSShell));
  gl.uniform3f(uniT.uCam,eye[0],eye[1],eye[2]);
  gl.uniform1f(uniT.uPet,1);gl.uniform1f(uniT.uFrK,1);gl.uniform1f(uniT.uGrid,DBGCHECK(DBG_GRID,1));
  gl.uniform1f(uniT.uPetA,DBGCHECK(DBG_PETA,1.30));
  /* 单圈环流页：连续大气圆顶按纬度渐变染教科书配色（淡青→极地淡紫→赤道粉带）；其余页不染色 */
  gl.uniform1f(uniT.uVcRim,0);
  if(mode===2){gl.uniform3f(uniT.uTint,1.0,1.0,1.0);gl.uniform1f(uniT.uTintK,0.97);}
  else{gl.uniform3f(uniT.uTint,0.0,0.0,0.0);gl.uniform1f(uniT.uTintK,0.0);}
  const drawGeom=g=>{
    gl.bindBuffer(gl.ARRAY_BUFFER,g.p);
    gl.enableVertexAttribArray(uniT.aP);gl.vertexAttribPointer(uniT.aP,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,g.n);
    gl.enableVertexAttribArray(uniT.aN);gl.vertexAttribPointer(uniT.aN,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ARRAY_BUFFER,g.c);
    gl.enableVertexAttribArray(uniT.aC);gl.vertexAttribPointer(uniT.aC,3,gl.FLOAT,false,0,0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,g.i);
    gl.drawElements(gl.TRIANGLES,g.count,gl.UNSIGNED_SHORT,0);
  };
  if(sA>0.02&&!(mode===0&&!circOn)){   /* 模式图页取消「三圈环流」：隐藏壳体帆板/回路管/急流 */
    if(mode===2){
      /* 单圈环流页：先画切口剖面口袋壁（切口经线墙 + 楔口中央透镜剖面壁，
         切开口内是罩体剖面而非裸地球），再画连续光滑大气圆顶 */
      gl.uniform1f(uniT.uTintK,0.82);          /* 剖面翼墙：与翼面同系蓝色（参考 GIF 翼缘为蓝） */
      for(const pk of pockets)drawGeom(pk);
      gl.uniform1f(uniT.uTintK,0.97);
      for(const d of domes)drawGeom(d);
    }else{
      const order=sails.map(s=>{
        const pw=rotVec(MSShell,sph(s.latMid,s.lonMid,1.14));
        const dx=pw[0]-eye[0],dy=pw[1]-eye[1],dz=pw[2]-eye[2];
        return {s,d:dx*dx+dy*dy+dz*dz};
      });
      order.sort((a,b)=>b.d-a.d);
      for(const o of order)drawGeom(o.s);
    }
    /* 回路亮描边管：模式图内部列边界很淡、剖切缘（-90/+30）亮描边；
       单圈页按圆顶切口两缘（cut=1）为亮红描边、外缘青色弧带更醒目（参考图） */
    const drawLoops=list=>{
      gl.uniform1f(uniT.uPet,0);
      gl.uniform1f(uniT.uVcRim,list===sloops?1:0);   /* 单圈页红/青回路：边缘色跟随顶点色（不被橙边污染） */
      const isCut=lp=>list===sloops?lp.cut:(lp.lonD===-90||lp.lonD===30);
      gl.uniform1f(uniT.uA,list===sloops?0.85:0.26);
      for(const lp of list)if(!isCut(lp))drawGeom(lp);
      gl.uniform1f(uniT.uA,0.97);
      for(const lp of list)if(isCut(lp))drawGeom(lp);
      gl.uniform1f(uniT.uVcRim,0);
    };
    if(mode===0)drawLoops(loops);          /* 三圈环流模式图：三圈环流回路 */
    /* 单圈环流页不再画回路管：参考 GIF 的环流完全由箭头表现（地表红箭头/剖面翼箭头/赤道上升弧） */
    if(mode===0&&showJet){                 /* 橙色高空急流带弧管（复选框控制，默认不显示） */
      gl.uniform1f(uniT.uA,0.94);
      for(const bt of belts)drawGeom(bt);
    }
  }
  gl.depthMask(true);
  gl.disable(gl.BLEND);

  drawOverlay(M,MSShell,V,P,eye,t);
}

function frame(ts){
  const t=ts/1000;
  const dt=Math.min(0.25,t-(lastT||t));
  lastT=t;
  if(!holdT){
    simT+=dt;
    if(spinOn)spin+=SPIN_RATE*dt;   /* 自转方向修正：地表特征向右（东向旋转）；可暂停 */
  }
  updateSeasonAnim(dt);             /* 季节移动缓动：与自转暂停无关，始终平滑推进 */
  render(simT);
  if(!window.__booted){                       /* 首帧完成 → 淡出加载提示 */
    window.__booted=true;
    const bd=document.getElementById('boot');
    if(bd){bd.classList.add('done');setTimeout(()=>bd.remove(),600);}
  }
  requestAnimationFrame(frame);
}
/* ================= 操作面板（左侧居中：视图选项卡常显；月份/高度下拉框仅真实大气运动图显示） ================= */
(function(){
  const monEl=document.getElementById('pMon'),levEl=document.getElementById('pLev'),
        tabEl=document.getElementById('pTabs');
  const names=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dynRows=Array.prototype.slice.call(document.querySelectorAll('#panel .prow[data-dyn]'));
  const setDataRows=on=>{
    for(const r of dynRows)r.style.display=on?'flex':'none';
  };
  const patRows=Array.prototype.slice.call(document.querySelectorAll('#panel .prow[data-pat],#panel .slabels[data-pat]'));
  const setPatternRows=on=>{      /* 仅「三圈环流模式图」显示的行（季节滑动条） */
    for(const r of patRows)r.style.display=on?'flex':'none';
  };
  const sync=(bs,i)=>bs.forEach((b,k)=>b.classList.toggle('on',k===i));
  const mk=(el,labels,cur,cb,cls)=>{
    el.innerHTML='';   /* 先清空再生成：脚本被热重载重复执行时不会追加出两组按钮 */
    const bs=labels.map((t,i)=>{
      const b=document.createElement('button');
      b.className=(cls||'pbtn')+(i===cur?' on':'');b.textContent=t;
      b.addEventListener('click',()=>cb(i));
      el.appendChild(b);return b;
    });
    return bs;
  };
  const fill=(el,labels,cur)=>{
    el.innerHTML='';
    labels.forEach((t,i)=>{
      const o=document.createElement('option');o.value=i;o.textContent=t;
      if(i===cur)o.selected=true;el.appendChild(o);
    });
  };
  /* 按钮顺序：单圈环流在最上；TAB_MODES 把按钮下标映射到内部模式号（0=三圈环流 1=真实 2=单圈） */
  const TAB_MODES=[2,0,1];
  /* 单圈环流页专属行（自转复选框）：仅「单圈环流」页显示 */
  const soloRows=Array.prototype.slice.call(document.querySelectorAll('#panel .prow[data-solo]'));
  const setSoloRows=on=>{for(const r of soloRows)r.style.display=on?'flex':'none';};
  /* 自转复选框：勾选地球自转，取消则不转（仅单圈环流页显示） */
  const spinChk=document.getElementById('pSpin');
  /* 三圈环流模式图专属行（高空急流复选框）：仅模式图显示 */
  const jetRow=document.querySelector('#panel .prow[data-jet]');
  const jetChk=document.getElementById('pJet');
  jetChk.addEventListener('change',()=>{showJet=jetChk.checked;});
  /* 三圈环流复选框（模式图专属行）：默认勾选；取消则隐藏球外围大气层与三圈环流箭头 */
  const circRow=document.querySelector('#panel .prow[data-circ]');
  const circChk=document.getElementById('pCirc');
  circChk.addEventListener('change',()=>{circOn=circChk.checked;});
  /* 「显示」行（地表风带/气压带/风带名称按钮）：仅三圈环流模式图显示 */
  const showRow=document.querySelector('#panel .prow[data-show]');
  const tb=mk(tabEl,['单圈环流','三圈环流模式图','真实大气运动图'],0,i=>{
    mode=TAB_MODES[i];sync(tb,i);
    const c0=camInit(mode);                  /* 每页默认视角与视距（模式图按参考图：近赤道平视、地球更大） */
    cam.theta=c0.theta;cam.phi=c0.phi;cam.dist=c0.dist;
    spinOn=(mode!==2);       /* 自转按页面：模式图/真实大气运动图默认自转，单圈环流页默认不自转 */
    spinChk.checked=spinOn;
    setDataRows(mode===1);   /* 月份/高度下拉框仅对真实大气运动图显示 */
    setPatternRows(mode===0);/* 季节滑动条仅对三圈环流模式图显示 */
    setSoloRows(mode===2);   /* 自转/海陆复选框仅对单圈环流页显示 */
    jetRow.style.display=(mode===0)?'flex':'none';   /* 高空急流复选框仅模式图显示 */
    circRow.style.display=(mode===0)?'flex':'none';  /* 三圈环流复选框仅模式图显示 */
    showRow.style.display=(mode===0)?'flex':'none';  /* 显示行（风带/气压带/风带名称按钮）仅模式图显示 */
    updateSlpUI();           /* 气压分布图复选框行随模式/月份显隐 */
  },'ptab');
  spinChk.checked=spinOn;
  spinChk.addEventListener('change',()=>{spinOn=spinChk.checked;});
  /* 海陆分布复选框（单圈环流页）：默认不勾选=纯蓝球体，勾选显示真实海陆贴图 */
  const landChk=document.getElementById('pLand');
  landChk.addEventListener('change',()=>{landOn=landChk.checked;});
  /* 平面图复选框（真实大气运动图页）：勾选隐藏立体地球，以平面世界图显示气压场+风向+气压中心 */
  const planChk=document.getElementById('pPlan');
  planChk.addEventListener('change',()=>{planOn=planChk.checked;});
  /* 地表风带 / 气压带 / 风带名称 显示开关 */
  const wBtn=document.getElementById('pWind'),bBtn=document.getElementById('pBelt'),wnBtn=document.getElementById('pWName');
  wBtn.addEventListener('click',()=>{showWind=!showWind;wBtn.classList.toggle('on',showWind);});
  bBtn.addEventListener('click',()=>{showBelts=!showBelts;bBtn.classList.toggle('on',showBelts);});
  wnBtn.addEventListener('click',()=>{showWindName=!showWindName;wnBtn.classList.toggle('on',showWindName);});
  /* 面板收起/展开：贴左缘手柄，收起时面板整体滑出屏幕左侧 */
  const panelEl=document.getElementById('panel');
  const foldTab=document.getElementById('pFoldTab');
  foldTab.addEventListener('click',()=>{
    const folded=panelEl.classList.toggle('folded');
    foldTab.textContent=folded?'›':'‹';
    foldTab.title=folded?'展开视图面板':'收起视图面板';
  });
  /* 恢复视图：视角与缩放回落到当前页的默认值（模式图按参考图视角） */
  document.getElementById('pReset').addEventListener('click',()=>{
    const c0=camInit(mode);
    cam.theta=c0.theta;cam.phi=c0.phi;cam.dist=c0.dist;
    planReset();   /* 平面图缩放/平移一并复位 */
    drag=null;
  });
  /* 季节移动滑动条：一年连续循环。t∈[0,1]：0=冬（最南）→0.25=春→0.5=夏（最北）→0.75=秋→1=冬。
     SEASON_D=-5·cos(2πt)（冬-5/春秋0/夏+5）——移动幅度按高中课本约 5 个纬度（夏季北移、冬季南移）；
     滑动条正下方「冬 春 夏 秋 冬」刻度标签，滑到某季节范围内高亮该文字 */
  const sl=document.getElementById('pSeason'),sv=document.getElementById('pSeasonVal');
  const sLabels=Array.prototype.slice.call(document.querySelectorAll('#panel .slabels span'));
  const seasonName=t=>{   /* 返回 [季节名, 高亮标签下标]；范围以相邻刻度中点分界 */
    if(t<1/8||t>=7/8)return ['冬季',t<0.5?0:4];
    if(t<3/8)return ['春季',1];
    if(t<5/8)return ['夏季',2];
    return ['秋季',3];
  };
  const seasonD=t=>-5*Math.cos(2*Math.PI*t);
  const seasonUI=t=>{
    const r=seasonName(t);
    sv.textContent=r[0];
    sLabels.forEach((s,i)=>s.classList.toggle('on',i===r[1]));
  };
  seasonUI(+sl.value);
  sl.addEventListener('input',()=>{
    seasonUI(+sl.value);
    setSeason(seasonD(+sl.value));
  });
  /* 季节演示：点击后自动连续播放一整年——冬季→春季→夏季→秋季→冬季循环，
     风带气压带与三圈环流沿滑动条连续平滑移动（余弦曲线，无档位感）；再点一次或手动拖动停止 */
  const demoBtn=document.getElementById('pDemo');
  const DEMO_YEAR=9.2;          /* 一整年循环时长（秒），与旧四档节奏一致 */
  let demoRAF=null,demoT=0,demoLast=0,demoWait=false;
  const demoStop=()=>{
    if(demoRAF){cancelAnimationFrame(demoRAF);demoRAF=null;}
    demoBtn.classList.remove('on');demoBtn.textContent='季节演示';
  };
  const demoTick=ts=>{
    if(demoLast===0)demoLast=ts;
    const dt=Math.min(0.1,(ts-demoLast)/1000);demoLast=ts;
    if(demoWait){                            /* 先等初始「回到冬季」缓动到位，再开始连续推进 */
      if(seasonProg>=1)demoWait=false;
    }else{
      demoT=(demoT+dt/DEMO_YEAR)%1;
      SEASON_T=SEASON_D0=seasonD(demoT);
      SEASON_D=SEASON_T;seasonProg=1;        /* 演示为连续驱动：直接跟随滑动条（曲线本身平滑，无需再缓动） */
      rebuildSeasonGeom();
      sl.value=demoT.toFixed(4);
      seasonUI(demoT);
    }
    demoRAF=requestAnimationFrame(demoTick);
  };
  demoBtn.addEventListener('click',()=>{
    if(demoRAF){demoStop();return;}
    demoBtn.classList.add('on');demoBtn.textContent='停止演示';
    demoT=0;demoLast=0;demoWait=true;
    sl.value=0;seasonUI(0);
    setSeason(seasonD(0));                   /* 先缓动到冬季起点，随后连续播放 */
    demoRAF=requestAnimationFrame(demoTick);
  });
  sl.addEventListener('input',demoStop);         /* 手动拖动滑动条 → 停止演示 */
  window.__demoState=()=>({on:!!demoRAF,v:+sl.value,t:demoT,name:sv.textContent,
    hi:sLabels.findIndex(s=>s.classList.contains('on'))});
  window.__demoClick=()=>demoBtn.click();
  fill(monEl,names,0);fill(levEl,WLEV,0);
  /* 海平面气压分布图复选框：仅真实大气运动图+1月/7月时显示；标签随月份切换 */
  const slpRow=document.getElementById('pSlpRow'),slpChk=document.getElementById('pSlp'),
        slpLab=document.getElementById('pSlpLab'),
        planRow=document.getElementById('pPlanRow');
  window.__slpUI={};
  const updateSlpUI=()=>{
    const ok=(mode===1)&&(curMon===0||curMon===6);
    slpRow.style.display=ok?'flex':'none';
    planRow.style.display=ok?'flex':'none';   /* 平面图复选框仅 1月/7月 显示 */
    if(!ok){planOn=false;planChk.checked=false;planReset();}   /* 切走月份/页面时退出平面模式并复位缩放 */
    slpLab.innerHTML=names[curMon]+'海平面气压<br>与风向图';   /* 分两行显示 */
    slpOn=ok&&slpChk.checked;
    window.__slpUI={visible:ok,checked:slpChk.checked,on:slpOn};
  };
  slpChk.addEventListener('change',updateSlpUI);
  monEl.addEventListener('change',()=>{
    curMon=+monEl.value;buildDense();updateSlpUI();
  });
  levEl.addEventListener('change',()=>{curLev=+levEl.value;buildDense();});
  setDataRows(false);     /* 默认单圈环流页：隐藏月/层/气压行 */
  document.getElementById('pPlanRow').style.display='none';   /* 默认隐藏平面图行（仅真实大气页 1月/7月显示） */
  setPatternRows(false);  /* 默认单圈环流页：隐藏季节滑动条 */
  setSoloRows(true);      /* 默认单圈环流页：显示自转/海陆复选框 */
  jetRow.style.display='none';   /* 默认单圈环流页：隐藏高空急流复选框 */
  circRow.style.display='none';  /* 默认单圈环流页：隐藏三圈环流复选框（仅模式图页显示） */
  showRow.style.display='none';  /* 默认单圈环流页：隐藏显示行（仅模式图页显示） */
})();

init();
requestAnimationFrame(frame);
/* 确定性定位（测试/检视用）：暂停累积并定格到相位 s 秒 */
window.__seek=s=>{holdT=true;simT=s;spin=-16*D2R+SPIN_RATE*s;render(simT);};
window.__pick=(x,y)=>{const g=pickGeo(x,y);if(!g)return null;
  return {lat:g.lat,lon:g.lon,p:slpSample(g.lat,g.lon,(curMon===6)?1:0)};};
window.__uGrid=v=>{DBG_GRID=v;};
window.__denseLen=()=>DENSE.length;
window.__spinAngle=()=>spin;
window.__camState=()=>({theta:cam.theta,phi:cam.phi,dist:cam.dist,init:CAM0});
window.__setCam=(t,p,d)=>{cam.theta=t;cam.phi=p;cam.dist=d;};
window.__latLines=()=>LAT_LINES.slice();
window.__modeState=()=>({mode,loops:loops.length,sloops:sloops.length,
  s0:sloops[0]?{latA:sloops[0].latA,latB:sloops[0].latB,H:sloops[0].H,dir:sloops[0].dirSign}:null});
window.__domeH=lat=>domeH(lat);   /* 调试：大气厚度剖面（单圈环流页） */
window.__windSpans=()=>WIND_ARROWS.map(a=>{const l1=a.lat0+SEASON_D,l2=a.lat0+SEASON_D+a.d[0]*a.len;return [Math.min(l1,l2),Math.max(l1,l2)];});
window.__seasonState=()=>({d:SEASON_D,t:SEASON_T,sails:sails.length,loops:loops.length,belts:belts.length,topLat:Math.max(...loops.map(l=>l.latB))});
window.__seasonSet=d=>setSeason(d);   /* 调试：任意目标偏移（走缓动） */

/* 启动期未捕获错误提示（便于远程排查 3D 不显示问题） */
window.addEventListener('error',e=>{
  if(window.__errShown)return; window.__errShown=true;
  const tip=document.createElement('div');
  tip.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#5a1a1a;color:#ffd;border:1px solid #a55;border-radius:8px;padding:10px 16px;font:13px/1.6 sans-serif;z-index:9999;max-width:90vw';
  tip.textContent='页面脚本出错，3D 可能无法显示：'+(e.message||e.type)+'（刷新或更换浏览器可尝试恢复）';
  document.body.appendChild(tip);
});

/* 检视用：当前季节下各纬带的实际纬度（三圈环流圈 / 地表气压带 / 风带箭头） */
window.__beltLats=()=>({
  d:SEASON_D,
  loops:loops.filter((l,i)=>i%LOOP_LONS.length===0).map(l=>[l.latA,l.latB]),
  belts:BELT_LATS.map(l=>l+SEASON_D),
  windSpans:WIND_ARROWS.map(a=>{const l1=a.lat0+SEASON_D,l2=a.lat0+SEASON_D+a.d[0]*a.len;return [Math.min(l1,l2),Math.max(l1,l2)];})
});
window.__uPetA=v=>{DBG_PETA=v;};
let DBG_GRID=null,DBG_PETA=null;
</script>
